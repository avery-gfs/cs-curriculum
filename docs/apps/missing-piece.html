<!--
Build a standalone web app styled like emoji-comparison.html. Simulate a sliding
number puzzle using a 2 x 4 grid containing tiles 1–7 and one empty square.
Show two copies side by side: the left puzzle must always be solvable and the
right puzzle must always be unsolvable, but do not say this anywhere in visible
site text. Clicking a puzzle gives it keyboard focus, visibly indicated. Arrow
keys move a tile into the empty square only when that move is legal; e.g. if the
empty square is to the right of tile 3, Right Arrow moves tile 3 right. Include
shuffle controls that preserve each puzzle's solvability or unsolvability.
Keep the tiles light gray and do not change tile color or puzzle position on
hover or selection. Use a single puzzle border rather than a separate border
and shadow, with intermediate brightness between the existing border and
shadow colors.
Use individual shuffle buttons for each puzzle.
For the solved left puzzle, use #eaae1f for the focused border and #ffe5a7
when it is not focused.
Show a quick animated tile motion whenever a puzzle is shuffled.
Show the actual intermediate legal tile moves during shuffling, rather than
only animating the final arrangement.
Add a subtle monospace section below each puzzle showing the linearized tile
list without the blank, live-updated.
Start both boards shuffled on every page reload while preserving their solvability.
Update to be 3x3 with numbers 1-8.
dedupe logic between animated shuffle and immediate shuffle.
within the linearized display, highlight the last moved number and the two other shifted numbers in the case of move across rows.
...plus manual style editing
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Missing Piece</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --indigo: #7d75ff;
        --indigo-dark: #5f55ff;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --canvas: #f3f4f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        color: var(--ink);
        background: var(--canvas);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 850px);
        padding: clamp(24px, 5vw, 42px);
        background: white;
        border-radius: 24px;
      }

      header {
        text-align: center;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        color: #111827;
        font-size: clamp(2rem, 5vw, 2.8rem);
        letter-spacing: -0.055em;
      }
      header p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .puzzles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .puzzle-column {
        min-width: 0;
      }
      .puzzle {
        width: 100%;
        border: 2px solid var(--line);
        border-radius: 18px;
        background: #fafafa;
        padding: 18px;
        text-align: left;
        cursor: pointer;
        transition: border-color 300ms linear, background-color 300ms linear;
      }
      .puzzle:hover {
        border-color: #b8bec8;
      }
      .puzzle:focus-visible, .puzzle.active {
        outline: none;
        border-color: #b8bec8;
      }
      .puzzle-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .tile, .empty {
        aspect-ratio: 1;
        border-radius: 11px;
        display: grid;
        place-items: center;
      }
      .tile {
        color: #374151;
        background: #e5e7eb;
        font-size: clamp(1.15rem, 4vw, 1.75rem);
        font-weight: 800;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }
      .puzzle:hover .tile {
        background: #e5e7eb;
      }
      .puzzle.solved {
        border-color: #ffe5a7;
        background-color: #fff8e7;
      }
      .puzzle.active.solved {
        border-color: #eaae1f;
      }
      .empty {
        border: 2px dashed #d1d5db;
        background: #f3f4f6;
      }
      .actions {
        display: flex;
        justify-content: center;
        margin-top: 28px;
      }
      button.shuffle {
        border: 0;
        border-radius: 10px;
        padding: 12px 21px;
        background: var(--indigo);
        color: white;
        font: 700 1rem Inter, system-ui, sans-serif;
        cursor: pointer;
        transition: transform 0.16s ease, background-color 0.16s ease;
      }
      button.shuffle:hover {
        background: var(--indigo-dark);
        transform: scale(1.035);
      }
      button.shuffle:focus-visible {
        outline: 3px solid #a5b4fc;
        outline-offset: 3px;
      }
      .puzzle > button.shuffle {
        width: 100%;
        margin-top: 16px;
        padding: 9px 14px;
        font-size: 0.9rem;
      }
      .puzzle-state {
        margin: 10px 4px 0;
        color: #9ca3af;
        font: 500 1rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
      .puzzle-state span {
        padding: 0 0.2em;
        border-radius: 4px;
        transition: color 300ms linear, background-color 300ms linear;
      }
      .puzzle-state .last {
        color: #438cff;
        background-color: #438cff22;
        font-weight: 700;
      }
      .puzzle-state .shifted {
        color: #438cff;
        background-color: #438cff22;
        font-weight: 700;
      }
      @media (max-width: 560px) {
        body {
          padding: 14px;
        }
        main {
          border-radius: 18px;
        }
        .puzzles {
          gap: 12px;
        }
        .puzzle {
          padding: 12px;
          border-radius: 14px;
        }
        .board {
          gap: 5px;
        }
        .puzzle-label {
          font-size: 0.68rem;
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Missing Piece</h1>
        <p>Choose a puzzle, then use the arrow keys to slide its tiles.</p>
      </header>

      <section class="puzzles" aria-label="Sliding puzzles">
        <div class="puzzle-column">
          <div
            class="puzzle active"
            tabindex="0"
            role="button"
            data-puzzle="0"
            aria-label="First puzzle. Use arrow keys to move tiles."
          >
            <span class="puzzle-label">Puzzle one</span>
            <span class="board" aria-hidden="true"></span>
            <button class="shuffle" type="button">Shuffle</button>
          </div>
          <div class="puzzle-state" aria-live="polite"></div>
        </div>
        <div class="puzzle-column">
          <div
            class="puzzle"
            tabindex="0"
            role="button"
            data-puzzle="1"
            aria-label="Second puzzle. Use arrow keys to move tiles."
          >
            <span class="puzzle-label">Puzzle two</span>
            <span class="board" aria-hidden="true"></span>
            <button class="shuffle" type="button">Shuffle</button>
          </div>
          <div class="puzzle-state" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const ROWS = 3;
        const COLS = 3;
        const LAST = ROWS * COLS - 1; // index of the blank in the solved layout
        const SHUFFLE_STEPS = 24;

        const puzzles = [...document.querySelectorAll(".puzzle")];
        // The second arrangement differs by one tile swap.
        const states = [
          [1, 2, 3, 4, 5, 6, 7, 8, null],
          [2, 1, 3, 4, 5, 6, 7, 8, null],
        ];
        const shuffleTimers = [null, null];
        // Per puzzle: { value, shifted } for the most recent move, or null.
        const lastMoves = [null, null];
        // Per puzzle: the persistent <span> elements of the state line.
        // They are created once and only mutated afterwards, so CSS
        // transitions on their color have a previous style to animate from.
        const stateSpans = [null, null];
        let activeIndex = 0;

        function initState(index) {
          const items = [];
          const parts = ["tiles: ["];
          for (let position = 0; position < ROWS * COLS - 1; position += 1) {
            if (position > 0) parts.push(", ");
            const item = document.createElement("span");
            items.push(item);
            parts.push(item);
          }
          parts.push("]");
          puzzles[index].parentElement.querySelector(".puzzle-state")
            .replaceChildren(...parts);
          stateSpans[index] = items;
        }

        function render(index) {
          const puzzle = puzzles[index];
          const board = puzzles[index].querySelector(".board");
          board.replaceChildren(...states[index].map((value) => {
            const square = document.createElement("span");
            square.className = value === null ? "empty" : "tile";
            square.textContent = value === null ? "" : value;
            return square;
          }));
          const solved = index === 0 &&
            states[index].every((value, position) =>
              value === (position === LAST ? null : position + 1)
            );
          puzzle.classList.toggle("solved", solved);

          // Update the existing spans in place instead of rebuilding them.
          const last = lastMoves[index];
          const tiles = states[index].filter((value) => value !== null);
          stateSpans[index].forEach((item, position) => {
            const value = tiles[position];
            item.textContent = value;
            item.className = last && value === last.value
              ? "last"
              : last && last.shifted.includes(value)
              ? "shifted"
              : "";
          });
        }

        function setActive(index, focus = false) {
          activeIndex = index;
          puzzles.forEach((puzzle, puzzleIndex) =>
            puzzle.classList.toggle("active", puzzleIndex === index)
          );
          if (focus) puzzles[index].focus();
        }

        function move(index, key) {
          if (shuffleTimers[index]) return false;
          const deltas = {
            ArrowUp: [0, -1],
            ArrowDown: [0, 1],
            ArrowLeft: [-1, 0],
            ArrowRight: [1, 0],
          };
          const [dx, dy] = deltas[key] || [];
          if (dx === undefined) return false;
          const blank = states[index].indexOf(null);
          const blankRow = Math.floor(blank / COLS);
          const blankColumn = blank % COLS;
          // The named direction is the tile's direction of travel, toward the blank.
          const tileRow = blankRow - dy;
          const tileColumn = blankColumn - dx;
          if (
            tileRow < 0 || tileRow >= ROWS || tileColumn < 0 ||
            tileColumn >= COLS
          ) {
            return false;
          }
          slide(index, tileRow * COLS + tileColumn);
          render(index);
          return true;
        }

        // Slides the tile at `tile` into the blank and records the move.
        // In reading order (blank excluded), a vertical move hops the tile over
        // the COLS - 1 tiles between the two cells; those shift by one place.
        // A horizontal move leaves the reading order unchanged.
        function slide(index, tile) {
          const cells = states[index];
          const blank = cells.indexOf(null);
          const value = cells[tile];
          const vertical = tile % COLS === blank % COLS;
          const shifted = vertical
            ? cells.slice(Math.min(tile, blank) + 1, Math.max(tile, blank))
            : [];
          cells[blank] = value;
          cells[tile] = null;
          // Only a move between rows reorders the tiles list, so only it is highlighted.
          lastMoves[index] = vertical ? { value, shifted } : null;
        }

        // One random legal move, never undoing the previous one.
        // Returns the blank's old position, which is the next call's previousBlank.
        function shuffleStep(index, previousBlank) {
          const blank = states[index].indexOf(null);
          const row = Math.floor(blank / COLS);
          const column = blank % COLS;
          const options = [];
          [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => {
            const nextRow = row + dy,
              nextColumn = column + dx,
              next = nextRow * COLS + nextColumn;
            if (
              nextRow >= 0 && nextRow < ROWS && nextColumn >= 0 &&
              nextColumn < COLS && next !== previousBlank
            ) options.push(next);
          });
          slide(index, options[Math.floor(Math.random() * options.length)]);
          return blank;
        }

        function scrambleImmediately(index) {
          let previousBlank = -1;
          for (let step = 0; step < SHUFFLE_STEPS; step += 1) {
            previousBlank = shuffleStep(index, previousBlank);
          }
          lastMoves[index] = null;
        }

        function shuffleByLegalMoves(index) {
          if (shuffleTimers[index]) return;
          let previousBlank = -1;
          let step = 0;
          puzzles[index].classList.add("is-shuffling");
          shuffleTimers[index] = window.setInterval(() => {
            previousBlank = shuffleStep(index, previousBlank);
            render(index);
            step += 1;
            if (step >= SHUFFLE_STEPS) {
              window.clearInterval(shuffleTimers[index]);
              shuffleTimers[index] = null;
              puzzles[index].classList.remove("is-shuffling");
            }
          }, 45);
        }

        puzzles.forEach((puzzle, index) =>
          puzzle.addEventListener("click", () => setActive(index))
        );
        document.addEventListener("keydown", (event) => {
          if (!event.key.startsWith("Arrow")) return;
          if (move(activeIndex, event.key)) event.preventDefault();
        });
        puzzles.forEach((puzzle, index) => {
          puzzle.querySelector(".shuffle").addEventListener(
            "click",
            (event) => {
              event.stopPropagation();
              shuffleByLegalMoves(index);
              setActive(index);
            },
          );
        });
        states.forEach((_, index) => scrambleImmediately(index));
        states.forEach((_, index) => initState(index));
        states.forEach((_, index) => render(index));
      })();
    </script>
  </body>
</html>
