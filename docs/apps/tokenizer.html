<!DOCTYPE html>
<!--
see clean.js. program for turning text into tokens, for a simple predictive text
demo. make into a web page for students to use (single file html, css, js). Keep
styling minimal, doesn't have to be fancy. page should have a text box where
students can enter text and have it converted to a list of tokens (each on own
line) like reference file does. should be output section for this result text
with a copy button. should have at the top a bar where students can enter link
to wiki article, to have text of article added into the input box (adding new
link should append, not overwrite existing). also add button to clear input box.
add counter showing number of output tokens. include a comment in html file with
this and any subsequent prompts
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Tokenizer</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
        background: #fff;
        color: #222;
      }
      h1 {
        font-size: 1.4em;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 1.1em;
        margin: 0;
      }
      .bar {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
      }
      .bar input {
        flex: 1;
        min-width: 0;
        padding: 6px;
        font-size: 1em;
      }
      button {
        padding: 6px 12px;
        font-size: 1em;
        cursor: pointer;
      }
      #status {
        min-height: 1.3em;
        font-size: 0.9em;
        color: #666;
        margin-bottom: 12px;
      }
      #status.error {
        color: #b00;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0 6px;
      }
      .head .spacer {
        flex: 1;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 0.95em;
        padding: 8px;
      }
      #input {
        height: 220px;
      }
      #output {
        height: 320px;
        background: #f6f6f6;
      }
      #count {
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Text Tokenizer</h1>

    <form class="bar" id="wikiForm">
      <input
        id="wikiUrl"
        type="text"
        placeholder="Paste a Wikipedia link, e.g. https://en.wikipedia.org/wiki/Cat"
      >
      <button type="submit">Add article</button>
    </form>
    <div id="status"></div>

    <div class="head">
      <h2>Input text</h2>
      <span class="spacer"></span>
      <button id="clearBtn" type="button">Clear</button>
    </div>
    <textarea id="input" placeholder="Type or paste text here..."></textarea>

    <div class="head">
      <h2>Tokens</h2>
      <span id="count">0 tokens</span>
      <span class="spacer"></span>
      <button id="copyBtn" type="button">Copy</button>
    </div>
    <textarea id="output" readonly></textarea>

    <script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const count = document.getElementById("count");
      const status = document.getElementById("status");

      // Same cleaning steps as clean.js
      function tokenize(text) {
        return text
          .toLowerCase()
          .replace(/\[\d+\]/g, "")
          .replace(/[\[\]():;?!*_"“”,\r\n‘—]/g, " ")
          .replace(/[^\w]\.|\.[^\w]/g, " . ")
          .replace(/’ /g, " ")
          .replace(/’/g, "'")
          .replace(/\s+/g, "\n")
          .trim();
      }

      function update() {
        const result = tokenize(input.value);
        output.value = result;
        const n = result ? result.split("\n").length : 0;
        count.textContent = n + (n === 1 ? " token" : " tokens");
      }

      function setStatus(msg, isError) {
        status.textContent = msg;
        status.className = isError ? "error" : "";
      }

      input.addEventListener("input", update);

      document.getElementById("clearBtn").addEventListener("click", () => {
        input.value = "";
        update();
        input.focus();
      });

      document.getElementById("copyBtn").addEventListener(
        "click",
        async (e) => {
          const btn = e.target;
          try {
            await navigator.clipboard.writeText(output.value);
          } catch {
            output.select();
            document.execCommand("copy");
          }
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = "Copy"), 1200);
        },
      );

      // Parse a Wikipedia link into { host, title }
      function parseWikiUrl(raw) {
        let url;
        try {
          url = new URL(raw.trim());
        } catch {
          return null;
        }
        if (!/(^|\.)wikipedia\.org$/.test(url.hostname)) return null;
        // Normalize mobile links (en.m.wikipedia.org -> en.wikipedia.org)
        const host = url.hostname.replace(".m.wikipedia.org", ".wikipedia.org");
        let title = null;
        if (url.pathname.startsWith("/wiki/")) {
          title = decodeURIComponent(url.pathname.slice(6));
        } else if (url.searchParams.get("title")) {
          title = url.searchParams.get("title");
        }
        if (!title) return null;
        return { host, title: title.replace(/_/g, " ") };
      }

      document.getElementById("wikiForm").addEventListener(
        "submit",
        async (e) => {
          e.preventDefault();
          const field = document.getElementById("wikiUrl");
          const parsed = parseWikiUrl(field.value);
          if (!parsed) {
            setStatus("That doesn't look like a Wikipedia article link.", true);
            return;
          }
          setStatus("Loading “" + parsed.title + "”...");
          const api = "https://" + parsed.host +
            "/w/api.php?action=query&prop=extracts" +
            "&explaintext=1&redirects=1&format=json&origin=*&titles=" +
            encodeURIComponent(parsed.title);
          try {
            const res = await fetch(api);
            const data = await res.json();
            const page = Object.values(data.query.pages)[0];
            if (!page || page.missing !== undefined || !page.extract) {
              setStatus("Couldn't find that article.", true);
              return;
            }
            // Drop section heading lines like "== History =="
            const text = page.extract
              .split("\n")
              .filter((line) => !/^\s*=+.*=+\s*$/.test(line))
              .join("\n")
              .trim();
            input.value = input.value.trim()
              ? input.value.replace(/\s*$/, "") + "\n\n" + text
              : text;
            update();
            field.value = "";
            setStatus("Added “" + page.title + "”.");
          } catch (err) {
            setStatus("Error loading article: " + err.message, true);
          }
        },
      );

      update();
    </script>
  </body>
</html>
